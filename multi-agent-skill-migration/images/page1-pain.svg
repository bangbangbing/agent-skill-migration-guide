<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1440" fill="#FDFBF7"/>
  <!-- 顶部标题 -->
  <text x="80" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="32" fill="#FF6B35" font-weight="700">① 痛点：技能漂移是怎么发生的</text>
  <!-- 卡片容器 -->
  <rect x="60" y="100" width="960" height="560" rx="24" fill="#FFF" stroke="#E8E8E8" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.06))"/>
  <!-- 问题描述 -->
  <text x="100" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="24" fill="#333">同一个 skill 在不同 Agent 目录下出现多份实体拷贝：</text>
  <!-- 图示：分散的 agent 目录 -->
  <g transform="translate(100,220)">
    <rect width="200" height="100" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <text x="100" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" fill="#E65100" font-weight="700">~/.claude/skills/</text>
    <text x="100" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#888">frontend-dev/ (实体)</text>
  </g>
  <g transform="translate(340,220)">
    <rect width="200" height="100" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="100" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" fill="#2E7D32" font-weight="700">~/.workbuddy/skills/</text>
    <text x="100" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#888">frontend-dev/ (软链?)</text>
  </g>
  <g transform="translate(580,220)">
    <rect width="200" height="100" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <text x="100" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" fill="#E65100" font-weight="700">~/.openclaw/skills/</text>
    <text x="100" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#888">frontend-dev/ (实体)</text>
  </g>
  <g transform="translate(820,220)">
    <rect width="160" height="100" rx="12" fill="#F5F5F5" stroke="#BBB" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="80" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" fill="#888" font-weight="700">+ 其余 4 个 agent</text>
    <text x="80" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#AAA">...</text>
  </g>
  <!-- 箭头指向统一源 -->
  <path d="M200 350 Q540 420 880 350" stroke="#ccc" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <path d="M540 360 L540 420 M525 405 L540 425 L555 405" stroke="#FF6B35" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 统一权威源框 -->
  <g transform="translate(290,430)">
    <rect width="500" height="110" rx="20" fill="#FFF8E1" stroke="#FFB300" stroke-width="2.5"/>
    <text x="250" y="45" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="22" fill="#F57F17" font-weight="700">~/.agents/skill-lib/.dist/current/</text>
    <text x="250" y="75" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="18" fill="#888">← 所有软链最终应指向这里（唯一 true source）</text>
    <text x="250" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#E65100">⚠️ 实体目录绕过了这个约束 = 版本漂移源头</text>
  </g>
  <!-- 底部后果 -->
  <rect x="60" y="670" width="960" height="140" rx="16" fill="#FFEBEE"/>
  <text x="100" y="720" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="22" fill="#C62828" font-weight="700">后果</text>
  <text x="100" y="760" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="18" fill="#888">· 改一处要同步 N 遍，漏一处 = 行为不一致</text>
  <text x="100" y="790" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="18" fill="#888">· moved-aside 堆积数年无人清理</text>
  <text x="100" y="820" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK',sans-serif" font-size="18" fill="#888">· 归档时担心误删正在使用的技能</text>
  <!-- 底部页码 -->
  <text x="540" y="1390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#BBB">上一页 ⬅ · 第 2 页 / 共 6 页 · ➡️ 下一页</text>
</svg>